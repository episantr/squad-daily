<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Squad Daily</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f3ede1;
      --ink: #14100c;
      --accent: #b8391f;
      --subtle: #8a8175;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "Work Sans", sans-serif;
      min-height: 100vh;
      padding: 3rem 1.5rem;
      line-height: 1.6;
    }

    main {
      max-width: 36rem;
      margin: 0 auto;
    }

    h1 {
      font-family: "Fraunces", serif;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    p {
      color: var(--subtle);
      margin-bottom: 2rem;
    }

    ul {
      list-style: none;
    }

    li + li {
      margin-top: 0.5rem;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <h1>Squad Daily</h1>
    <p>Daily stand-up facilitator pages for every squad.</p>
    <ul>
      <li><a href="ccss/daily/">Core Card Systems Solutions</a></li>
      <li><a href="cds/daily/">Core Digital Solutions</a></li>
      <li><a href="cps/daily/">Card Payment Systems</a></li>
      <li><a href="tam/daily/">Tam Squad</a></li>
      <li><a href="partnership/daily/">Partnership Cards</a></li>
      <li><a href="miles/daily/">Miles Squad</a></li>
      <li><a href="business/daily/">Business Cards</a></li>
      <li><a href="atm/daily/">ATM Solutions</a></li>
    </ul>
  </main>
</body>
</html>
